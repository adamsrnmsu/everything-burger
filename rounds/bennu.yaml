# bennu on upstream main apps: #59 is main (with #54-#58 merged) plus the
# loguru migration. waterway runs bennu's C++ field device and simulink
# provider, so this exercises #55; it also installs the pybennu wheel, but
# nothing on waterway runs it: the `pybennu` round runs it on soap.
# `./burger bennu-check bennu` covers the pybennu and gobennu test suites.
description: upstream main apps + bennu #59 (main + loguru)
apps:
  prs: []
bennu:
  pr: 59
  install: [deb, pybennu]
  pip: ["loguru>=0.7,<1"]  # #59's new dependency; the VMs have no index
