# One block per #160 component, including those waterway cannot run (rtds,
# providerdata, collector, iperf, ssh). verify feeds this to
# phenix-scorch-validate, so every model is exercised on the installed code
# even when the component never starts.
components:
  - {name: disrupt-baseline, type: disruption, metadata: {current_disruption: baseline, run_duration: 30}}
  - name: disrupt-dos
    type: disruption
    metadata:
      current_disruption: dos
      run_duration: 300
      dos:
        attack_duration: 60
        start_delay: 10
        attacker: {hostname: kali, script_path: /root/dos.py, results_path: /root/results}
        targets: [{hostname: rtu-1}]
  - name: iperf
    type: iperf
    metadata:
      run_duration: 30
      iperf_paths: {linux: /usr/bin/iperf3, windows: /iperf-3.15-windows/iperf3.exe}
      servers: [{hostname: rtu-1, port_range_start: 5201, clients: [{hostname: rtu-2}]}]
  - {name: rtds, type: rtds, metadata: {hostname: simulink-provider}}
  - name: pcap
    type: pcap
    metadata: {vms: [{hostname: rtu-1, interface: 0}], create_merged_pcap: true, convertToJSON: true}
  - {name: tcpdump, type: tcpdump, metadata: {vms: [{hostname: rtu-1, iface: eth0}]}}
  - {name: collector, type: collector, metadata: {}}
  - {name: ssh, type: ssh, metadata: {ip: 172.16.1.101, user: root, cmds: [uptime]}}
  - {name: erspan, type: erspan, metadata: {local_bridge: phenix, local_ip: 192.0.2.1, remote_ip: 192.0.2.2}}
  - name: mm
    type: mm
    metadata:
      start: [{type: start_capture, capture: {bridge: phenix}}]
      stop: [{type: stop_capture, capture: {bridge: phenix}}]
  - {name: pipe, type: pipe, metadata: {pipe: burger, data: hello}}
  - {name: hoststats, type: hoststats, metadata: {pollPeriod: 5}}
  - {name: vmstats, type: vmstats, metadata: {vms: [rtu-1, rtu-2], pollPeriod: 1}}
  - {name: qos, type: qos, metadata: {vms: [{hostname: rtu-1, delay: 50ms}]}}
  - {name: providerdata, type: providerdata, metadata: {hostname: simulink-provider}}
