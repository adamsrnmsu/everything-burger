# #165 iperf between two waterway RTUs on the ICS network. bennu.qc2 has no
# iperf3, so burger installs the jammy packages into both VMs at boot.
description: "#165 iperf, rtu-2 to rtu-1"
apps:
  prs: [165]
validate: true
debs:
  packages: [iperf3, libiperf0, libsctp1]
  nodes: [rtu-1, rtu-2]
scorch:
  components:
    - name: iperf
      type: iperf
      metadata:
        run_duration: 20
        iperf_paths: {linux: /usr/bin/iperf3}
        servers:
          - hostname: rtu-1
            port_range_start: 5201
            clients: [{hostname: rtu-2}]
    - name: hold
      type: disruption
      metadata: {current_disruption: baseline, run_duration: 30}
  runs:
    - name: iperf
      configure: [iperf]
      # iperf start returns once the clients launch; hold keeps the stage
      # open past their 20 s run before stop collects the results.
      start: [iperf, hold]
      stop: [iperf]
      cleanup: [iperf]
