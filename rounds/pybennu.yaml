# pybennu under live load: bennu #59 (main with #54-#58 merged, plus the
# loguru migration) as both the deb and the pybennu wheel, on soap. waterway
# never runs pybennu; soap's power-provider is pybennu-power-solver (PyPower,
# case300), its siren VM runs pybennu-siren, and its four RTUs are the C++
# field device reading from the provider. upstream main apps, so a failure
# points at bennu.
#
# Only bennu.qc2 VMs are kept: ignition (licensed), netmonitor and attacker are
# dropped, and with them soap's mirror app. Nothing polls DNP3 without Ignition.
description: "bennu #59 deb + pybennu wheel on soap's PyPower provider"
topology: soap
apps:
  prs: []
bennu:
  pr: 59  # rebased on main, so it carries #54-#58
  install: [deb, pybennu]
  # #59 adds loguru; the VMs have no package index, so burger ships the wheel.
  pip: ["loguru>=0.7,<1"]
  nodes: [power-provider, rtu-1, rtu-2, rtu-3, rtu-4, siren]
drop_nodes: [ignition, netmonitor, attacker]
# Appended to the install and version checks on each bennu node. Anchored
# pgrep patterns cannot match the cc shell's own command line.
health:
  - hostname: power-provider
    start:
      - "pgrep -f '(^|/)pybennu-power-solver( |$)'"
      # #59: sceptre-start.sh runs `start -d`, so loguru writes DEBUG here.
      - "grep -Eq ' \\| (INFO|DEBUG) +\\| ' /var/log/bennu/pybennu-power-solver.log"
      - "! grep -E ' \\| (ERROR|CRITICAL) +\\| ' /var/log/bennu/pybennu-power-solver.log"
  - hostname: rtu-1
    start: &rtu
      - "pgrep -f '(^|/)bennu-field-deviced?( |$)'"
      # The pybennu provider answers the C++ RTU: its last tcp:// endpoint.
      - "ep=$(sed -n 's#.*<endpoint>\\(tcp://[^<]*\\)</endpoint>.*#\\1#p' /etc/sceptre/config.xml | tail -1); timeout 30 bennu-probe --endpoint \"$ep\" --command query | grep -q 'bus-'"
  - {hostname: rtu-2, start: *rtu}
  - {hostname: rtu-3, start: *rtu}
  - {hostname: rtu-4, start: *rtu}
scorch:
  components:
    # Advisory: without the LabJack, pybennu-siren fails after startup. Its
    # log file proves only #59's file sink, not siren.
    - name: siren-log
      type: cc
      metadata:
        vms:
          - hostname: siren
            start:
              - {type: exec, args: "test -s /var/log/bennu/pybennu-siren.log", wait: true}
  runs:
    - name: extras-siren
      start: [siren-log]
