site_name: burger
site_description: Switchboards of live tests for sceptre-phenix apps and bennu
site_url: https://adamsrnmsu.github.io/everything-burger/
repo_url: https://github.com/adamsrnmsu/everything-burger
repo_name: adamsrnmsu/everything-burger
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

# Internal design notes and plans stay in the repo, not on the site.
exclude_docs: |
  specs/
  superpowers/

hooks:
  - scripts/docs_hooks.py

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: amber
      toggle: {icon: material/brightness-4, name: Dark mode}
    - scheme: slate
      primary: red
      accent: amber
      toggle: {icon: material/brightness-7, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Run book: run-book.md
      - Running behind a proxy: proxy.md
  - Concepts:
      - Switchboards: switchboards.md
      - Items: items.md
      - Checks: checks.md
      - Routes: routes.md
  - Results:
      - What verify checks: verify.md
      - Where files go: files.md
  - Configuration: configuration.md
  - Coverage: coverage.md
  - Limitations and troubleshooting: limitations.md
  - Reference:
      - Items: reference/items.md
      - Switchboards: reference/switchboards.md
      - CLI: reference/cli.md
