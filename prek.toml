# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
# Install the hooks once: prek install --hook-type pre-commit --hook-type commit-msg
# Run manually: prek run --all-files
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.3"
default_language_version.python = "3.12"

# Hooks at the same priority run concurrently; lower priorities run first, so
# the fixers finish before the checks. tests/golden/ holds byte-exact renders
# from the old script and src/burger/assets/mascot.ans is generated ANSI art:
# both are kept out of the fixers.

# Lint and format Python (same rules as `make check`).
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.1"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]
priority = 2

[[repos.hooks]]
id = "ruff-format"
priority = 3

# Dead code (same paths as `make check`).
[[repos]]
repo = "https://github.com/jendrikseipp/vulture"
rev = "v2.16"

[[repos.hooks]]
id = "vulture"
pass_filenames = false
args = ["src", "tests"]
priority = 4

# Spell checking.
[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

[[repos.hooks]]
id = "codespell"
# ans: the mascot's file extension; verfy: a deliberate typo in a test
args = ["--ignore-words-list", "ans,verfy"]
exclude = { glob = ["tests/golden/**", "src/burger/assets/**"] }
priority = 4

# The ./burger shim.
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"

[[repos.hooks]]
id = "shellcheck"
args = ["--severity=warning"]
priority = 4

# Enforce conventional commit messages.
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["feat", "fix", "docs", "style", "refactor", "test", "chore", "ci", "build", "perf"]
priority = 4

# General repository hygiene checks built into prek.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "fix-byte-order-marker"
priority = 0

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
types_or = ["python", "markdown", "yaml", "toml", "shell"]
priority = 1

[[repos.hooks]]
id = "end-of-file-fixer"
types_or = ["python", "markdown", "yaml", "toml", "shell"]
priority = 1

[[repos.hooks]]
id = "check-yaml"
priority = 4

[[repos.hooks]]
id = "check-toml"
priority = 4

[[repos.hooks]]
id = "check-json"
priority = 4

[[repos.hooks]]
id = "check-merge-conflict"
priority = 4

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]
priority = 4

[[repos.hooks]]
id = "check-case-conflict"
priority = 4

[[repos.hooks]]
id = "check-executables-have-shebangs"
priority = 4

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
priority = 4

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]
priority = 4
