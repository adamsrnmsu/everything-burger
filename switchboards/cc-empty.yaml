# cc commands that print nothing return "" instead of None (#194, merged
# 2026-10-23), so a validator on one no longer crashes the cc component (#186).
# A regression check on main; a main older than #194 crashes here.
#
# cc-output-parsing is #183's failure case (stderr before stdout, '/' and ':'
# in stdout), also on main. The bennu items give the waterway health run,
# which also waits out VM boot.
about: "empty cc output, validator on a silent command (main)"
route: waterway
apps: {prs: []}
items:
  cc-empty-output: on
  cc-output-parsing: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
