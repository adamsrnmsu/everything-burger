# bennu #59 (main with #54-#58 merged, plus the loguru migration) on upstream
# main apps. waterway runs the C++ field device and simulink provider; the
# pybennu wheel is installed too, but only the pybennu switchboard runs it.
about: upstream main apps + bennu #59 (main + loguru)
route: waterway
apps: {prs: []}
bennu:
  pr: 59
  install: [deb, pybennu]
  pip: ["loguru>=0.7,<1"]  # #59's new dependency; the VMs have no index
items:
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
