# bennu main (#54-#59 are merged: the loguru migration included) on upstream
# main apps. waterway runs the C++ field device and simulink provider; the
# pybennu wheel is installed too, but only the pybennu switchboard runs it.
about: upstream main apps + bennu main (deb and pybennu wheel)
route: waterway
apps: {prs: []}
bennu:
  branch: main
  install: [deb, pybennu]
  pip: ["loguru>=0.7,<1"]  # bennu main needs it since #59; bennu.qc2 lacks it and the VMs have no index
items:
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
