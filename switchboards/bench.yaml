# Live proof of bennu #55 (batched field-device writes), merged. burger builds bennu
# main (#59 and the rest are on it) as the vehicle. The bench fails when one 800-tag
# cycle takes longer than 2 s. Drop the
# `bennu:` block to time stock bennu.qc2 instead (the "before" number).
about: "bennu main (#55) on soap: field-device write cycle at 800 tags, fails above 2 s"
route: soap
apps: {prs: []}
bennu:
  branch: main
  install: [deb, pybennu]
  pip: ["loguru>=0.7,<1"]  # bennu main needs it since #59; bennu.qc2 lacks it and the VMs have no index
items:
  field-device-bench: on
