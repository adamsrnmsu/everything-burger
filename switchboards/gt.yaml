# Live proof of bennu #84, #85 and #86 (pybennu groundtruth_monitor): the three drafts merged on
# upstream main (fork branch fix-groundtruth-all, a merge of the PR heads; rebuild it with
# `git merge fix-groundtruth-correctness fix-groundtruth-es8-client fix-groundtruth-bounded-retry`
# on upstream/main and push it when a PR head moves). The pybennu wheel is built natively for arm64
# and installed on the VMs. A real Elasticsearch runs in a container on the phenix docker host:
# start it with `scripts/groundtruth-es.sh start` before the run and `stop` after; the monitor
# on waterway-provider reaches it over mgmt_tap's host address. Control boards: `gt-stock`
# (stock bennu-arm64 image) and `gt-es8` (#85 only, the baseline for #84 and #86).
about: "bennu #84 #85 #86: groundtruth_monitor against a real Elasticsearch on the arm64 range"
route: waterway-arm64
apps: {prs: []}
bennu:
  branch: fix-groundtruth-all
  remote: fork
  install: [pybennu]
  # The image lacks loguru, and its pyzmq has no draft API (RADIO/DISH, which the pybennu
  # publisher and subscriber need): build a draft pyzmq from source. The monitor then runs
  # with LD_LIBRARY_PATH=/usr/local/lib, bennu's draft libzmq. The VMs have no index.
  pip: ["loguru>=0.7,<1", "pyzmq==27.2.0"]
  pip_env: {ZMQ_DRAFT_API: "1", PIP_NO_BINARY: pyzmq}
items:
  apps/mgmt_tap: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
  groundtruth: on
