# Live proof of bennu #84 to #89 (pybennu groundtruth_monitor): the PR heads merged in order over
# upstream main by burger (#89 contains #86's commit until #86 merges). The pybennu wheel is built
# natively for arm64 and installed on the VMs. A real Elasticsearch runs in a container on the
# phenix docker host, started on `up` and removed on `down` (services: scripts/groundtruth-es.sh);
# the monitor on waterway-provider reaches it over mgmt_tap's host address. Control boards:
# `gt-stock` (stock bennu-arm64 image), `gt-es8` (#85 only, the baseline for #84 and #86) and
# `gt-84-86` (exactly #84 #85 #86, the evidence in those PRs' bodies).
about: "bennu #84 to #89: groundtruth_monitor against a real Elasticsearch on the arm64 range"
route: waterway-arm64
apps: {prs: []}
services: [groundtruth-es]
bennu:
  prs: [84, 85, 86, 87, 88, 89]
  install: [pybennu]
  # The image lacks loguru, and its pyzmq has no draft API (RADIO/DISH, which the pybennu
  # publisher and subscriber need): build a draft pyzmq from source. The monitor then runs
  # with LD_LIBRARY_PATH=/usr/local/lib, bennu's draft libzmq. The VMs have no index.
  pip: ["loguru>=0.7,<1", "pyzmq==27.2.0"]
  pip_env: {ZMQ_DRAFT_API: "1", PIP_NO_BINARY: pyzmq}
items:
  apps/mgmt_tap: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
  groundtruth: on
