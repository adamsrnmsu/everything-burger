# ExperimentBase (#195, merged 2026-10-23) on main: topology lookups and the
# minimega connection live in one shared class that every app and component uses.
# The paths every run takes:
#   - each cc health exec reads the node's os_type (extract_node_os_type), the
#     Windows nodes and the router included;
#   - vmstats with no `vms` walks every node's os_type and logs the Windows
#     and router nodes as skipped;
#   - pcap, tcpdump, mm, hoststats and disruption get minimega through the
#     shared mm property;
#   - mgmt_tap and mirror are AppBase apps (add_* on the shared lookups);
#   - helics resolves its root broker with extract_node_ip and the reverse
#     extract_node_hostname_for_ip.
# The error paths (a missing helics broker, null networks) stop the experiment
# before SCORCH runs; helics-no-broker checks the first offline.
about: "ExperimentBase lookups in apps and components (main)"
route: waterway
apps: {prs: []}
items:
  disruption: on
  pcap: on
  tcpdump: on
  mm: on
  vmstats: on
  hoststats: on
  apps/mgmt_tap: on
  apps/mirror: on
  apps/helics: on
  apps/helics-no-broker: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
overrides:
  vmstats:
    # no vms: the component picks every Linux node itself
    config: {vms: []}
    verify:
      - files: {glob: "vm_stats.jsonl", min: 1}
      # the Windows nodes are skipped by os_type, not looked up by name
      - log: {glob: "*.json", contains: "incompatible os_type 'windows'", windows: true}
