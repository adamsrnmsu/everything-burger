# iperf (#165, merged) between two waterway RTUs on the ICS network, on main (the cc filter
# helper it uses, #191, is merged). The bennu items give it the waterway health
# run, which also waits out VM boot (--settle).
about: "iperf 3.15, rtu-2 to rtu-1"
route: waterway
apps: {prs: []}
items:
  iperf: on
  disruption: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
runs:
  - name: iperf
    configure: [iperf]
    # iperf start returns once the clients launch; disruption keeps the stage
    # open past their 20 s run before stop collects the results.
    start: [iperf, disruption]
    stop: [iperf]
    cleanup: [iperf]
