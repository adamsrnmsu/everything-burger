# RTDS family on your own rig: rtds (#166), providerdata, collector (with the
# disruption it reads), and the PR build of pybennu on the provider VM. Needs
# BURGER_SITE_TOPOLOGY and BURGER_SITE_SCENARIO.
about: "#166 rtds, providerdata, collector + bennu #59 (pybennu) on a site RTDS rig"
route: site
apps: {prs: [166]}
bennu:
  pr: 59
  install: [pybennu]
  pip: ["loguru>=0.7,<1"]  # #59's new dependency; the VMs have no index
items:
  rtds: on
  providerdata: on
  collector: on
  disruption: on
  bennu/pybennu-provider: on
overrides:
  disruption: {config: {permutation: 0, run_duration: 120}}
runs:
  - name: rtds
    configure: [rtds, providerdata]
    start: [rtds, providerdata, disruption]
    stop: [providerdata, rtds, collector]
    cleanup: [rtds]
