# RTDS family on your own rig: rtds (#166), providerdata, collector (with the
# disruption it reads), and the bennu main build of pybennu on the provider VM.
# Needs BURGER_SITE_TOPOLOGY and BURGER_SITE_SCENARIO.
about: "#166 rtds, providerdata, collector + bennu main pybennu (#59) on a site RTDS rig"
route: site
apps: {prs: [166]}
bennu:
  branch: main
  install: [pybennu]
  pip: ["loguru>=0.7,<1"]  # bennu main needs it since #59; bennu.qc2 lacks it and the VMs have no index
items:
  rtds: on
  providerdata: on
  collector: on
  disruption: on
  bennu/pybennu-provider: on
overrides:
  disruption: {config: {permutation: 0, run_duration: 120}}
runs:
  - name: rtds
    configure: [rtds, providerdata]
    start: [rtds, providerdata, disruption]
    stop: [providerdata, rtds, collector]
    cleanup: [rtds]
