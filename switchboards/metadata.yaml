# #160 metadata models: the shared base #190, #164-#177 on it, and #191's cc
# filter helper, plus #158, on stock bennu. Models no route can run
# (disruption-dos) are checked offline by phenix-scorch-validate; the rtds,
# providerdata, collector, iperf and ssh models are validated on their own
# boards.
#
# The capture overrides test round 2 of review. pcap filters rtu-1 to
# non-Modbus traffic, then resets minimega's namespace-wide filter. mm's bridge
# capture starts after it, so if the reset fails the bridge capture has no
# Modbus. mm also captures one VM interface with a filter, stops only that
# interface and converts it. tcpdump converts to JSON. Any logger.error line in
# a status file fails the item, since these paths log and carry on.
about: "#158 + #190 + #164-#177 metadata models + #191"
route: waterway
apps: {prs: [158, 190, 164, 165, 166, 167, 168, 169, 170, 171, 172, 173, 174, 175, 176, 177, 191]}
items:
  disruption: on
  disruption-dos: on
  pcap: on
  tcpdump: on
  mm: on
  pipe: on
  hoststats: on
  vmstats: on
  qos: on
  erspan: on
  apps/mgmt-vlan-alias: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
overrides:
  pcap:
    config:
      vms:
        - {hostname: rtu-1, interface: 0, filter: "not tcp port 502"}
        - {hostname: rtu-2, interface: 0}
    verify:
      - status: ok
      - log: {glob: "*.json", lacks: "\\] ERROR :"}
      - files: {glob: "rtu-*.pcap", min: 2}
      # rtu-1's own filter applied, and did not carry over to rtu-2
      - python: {function: rtu1_has_no_modbus, windows: true}
      - pcap: {glob: "rtu-2-*.pcap", tcp_port: 502, min_packets: 10, windows: true}
  tcpdump:
    config:
      vms: [{hostname: rtu-2, iface: any, filter: "tcp port 502"}]
      convertToJSON: true
    verify:
      - status: ok
      # a failed kill or conversion is logged as an error and the stage carries on
      - log: {glob: "*.json", lacks: "\\] ERROR :"}
      - files: {glob: "*.pcap", min: 1}
      - files: {glob: "*.jsonl", min: 1}
      - pcap: {glob: "*.pcap", tcp_port: 502, min_packets: 10, windows: true}
  mm:
    config:
      start: [{type: start_capture, capture: {bridge: phenix, filename: burger-bridge.pcap}}]
      stop: [{type: stop_capture, capture: {bridge: phenix, convert: true}}]
      vms:
        - hostname: simulink-provider
          start:
            - type: start_capture
              capture: {interface: 0, filename: burger-provider.pcap, filter: "not tcp port 502"}
          stop: [{type: stop_capture, capture: {interface: 0, convert: true}}]
    verify:
      - status: ok
      - log: {glob: "*.json", lacks: "\\] ERROR :"}
      - files: {glob: "burger-*.pcap", min: 2}
      - files: {glob: "*.jsonl", min: 2}
      # pcap's "not tcp port 502" must be reset before this bridge capture starts
      - pcap: {glob: "burger-bridge.pcap", tcp_port: 502, min_packets: 10, windows: true}
  vmstats: {config: {vms: [rtu-1, rtu-2, simulink-provider]}}
  qos: {config: {vms: [{hostname: rtu-2, interface: 0, delay: 20ms}]}}
