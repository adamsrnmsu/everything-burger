# #155 security hardening on stock bennu: tcpdump, pcap and mm
# captures, pipe, mgmt_tap, and the mirror app feeding a monitor VM. Offline,
# pipe-bad-name checks the Token allowlist rejects a name main accepts.
about: "#155, pipe, mirror + mgmt_tap"
route: waterway
apps: {prs: [155]}
items:
  pcap: on
  tcpdump: on
  mm: on
  disruption: on
  pipe: on
  pipe-bad-name: on
  apps/mirror: on
  apps/mgmt_tap: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
overrides:
  tcpdump:
    config:
      vms: [{hostname: monitor, iface: any, filter: "tcp port 502 or ip proto 47"}]
    # The mirror delivers GRE: count it as well as plain Modbus, like the filter.
    verify:
      - files: {glob: "*.pcap", min: 1}
      - pcap: {glob: "*.pcap", tcp_port: 502, ip_proto: 47, min_packets: 10, windows: true}
  # #155 quotes a capture filter as one minimega argument: `capture pcap filter
  # tcp port 502` is an invalid command without the quotes, so on a head without
  # that fix the start stage fails. The filter keeps only Modbus on the bridge.
  mm:
    config:
      start:
        - type: start_capture
          capture: {bridge: phenix, filename: burger-bridge.pcap, filter: "tcp port 502"}
      stop: [{type: stop_capture, capture: {bridge: phenix}}]
    verify:
      - files: {glob: "burger-bridge.pcap", min: 1}
      - pcap: {glob: "burger-bridge.pcap", tcp_port: 502, min_packets: 10, windows: true}
