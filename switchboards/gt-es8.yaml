# Baseline for #84 and #86: only #85 (the elasticsearch-py 8 client and the console script),
# so the monitor runs and the UTC, rate-limit, memory and retry checks show the bugs live.
# Same Elasticsearch container as `groundtruth` (scripts/groundtruth-es.sh start).
about: "bennu #85 alone: groundtruth_monitor runs on elasticsearch-py 8, #84 and #86 still fail"
route: waterway-arm64
apps: {prs: []}
bennu:
  branch: fix-groundtruth-es8-client
  remote: fork
  install: [pybennu]
  # The image lacks loguru, and its pyzmq has no draft API (RADIO/DISH, which the pybennu
  # publisher and subscriber need): build a draft pyzmq from source. The monitor then runs
  # with LD_LIBRARY_PATH=/usr/local/lib, bennu's draft libzmq. The VMs have no index.
  pip: ["loguru>=0.7,<1", "pyzmq==27.2.0"]
  pip_env: {ZMQ_DRAFT_API: "1", PIP_NO_BINARY: pyzmq}
items:
  apps/mgmt_tap: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
  groundtruth: on
