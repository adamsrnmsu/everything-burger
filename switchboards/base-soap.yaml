# ExperimentBase on soap, where collector and the providers run. The
# collector's stop stage reads the experiment annotations with get_annotation,
# looks nodes up with require_node and extract_node_os_type, and skips nodes
# whose network is null; rtds and providerdata run under the shared mm and
# lookups; vmstats with no `vms` takes every Linux node by os_type.
# collector (#169), providerdata (#177) and ExperimentBase (#195) are on main;
# rtds still needs #166.
about: "collector, rtds, providerdata on soap (main + #166)"
route: soap
apps: {prs: [166]}
items:
  rtds: on
  providerdata: on
  collector: on
  disruption: on
  vmstats: on
  bennu/power-solver: on
overrides:
  disruption: {config: {run_duration: 60}}
  vmstats:
    config: {vms: []}
    verify:
      - files: {glob: "vm_stats.jsonl", min: 1}
runs:
  - name: base
    configure: [rtds, providerdata]
    start: [vmstats, rtds, providerdata, disruption]
    stop: [vmstats, providerdata, rtds, collector]
    cleanup: [rtds]
