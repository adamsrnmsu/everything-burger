# Named `integrate`, not `integration`: ebwes-integration is 17 characters, over
# phenix's 15-character experiment name limit.
# Upstream main plus every open phenix-apps PR with code (#166 rtds, #168 tcpdump,
# #202 snort), merged by burger at sync. PRs no longer
# edit CHANGELOG.md (releasaurus generates it), so they merge with each other
# cleanly and no hand-built integration branch is needed. If this passes, the
# open PRs can merge in any order. When one merges, drop it from `prs`. When
# all have merged, this board is the same as `main`.
#
# Items are the union of the metadata, harden, iperf, base and cc-empty boards
# on waterway (soap-only items such as provider's are left out: one route per
# board). One run holds them all; iperf's 20 s run fits inside disruption's
# 30 s hold, so the default layout works without iperf's own `runs`. Where the
# boards override the same item differently, metadata's override wins, plus
# harden's tcpdump capture on the monitor VM and its quoted mm bridge filter:
#   - tcpdump: harden's monitor VM and "tcp port 502 or ip proto 47" filter, with
#     metadata's convert_to_json and JSON checks, and harden's GRE packet check;
#   - mm: metadata's bridge + per-VM captures, the bridge one filtered to
#     "tcp port 502" (harden's quoted filter). The provider VM capture and the
#     pcap component's filter reset still run before it;
#   - vmstats: metadata's explicit VM list. base's `vms: []` (the component
#     picks every Linux node and skips Windows by os_type) cannot run in the
#     same component, so that default-list path is covered on `base` only.
# No two items share a component name, so nothing else had to be chosen.
#
# bennu is stock: no included item needs a bennu PR.
about: "main + every open phenix-apps PR (#166, #168, #202) together"
route: waterway
apps: {prs: [166, 168, 202, 205, 207, 208]}
items:
  disruption: on
  disruption-dos: on
  pcap-alias: on
  tcpdump-alias: on
  pcap: on
  tcpdump: on
  mm: on
  pipe: on
  pipe-bad-name: on
  hoststats: on
  vmstats: on
  qos: on
  vmstats-bad-name: on
  qos-bad-rate: on
  erspan: on
  iperf: on
  cc-empty-output: on
  cc-output-parsing: on
  # validate-only (routes: []) — new #160 models exercised offline; no infra yet
  opcexport: on
  caldera: on
  art: on
  apps/mgmt-vlan-alias: on
  apps/mirror: on
  apps/mgmt_tap: on
  apps/helics: on
  apps/helics-no-broker: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
overrides:
  pcap:
    config:
      vms:
        # not port 5201: iperf runs rtu-2 to rtu-1 and would fill both captures
        - {hostname: rtu-1, interface: 0, filter: "not tcp port 502 and not port 5201"}
        - {hostname: rtu-2, interface: 0, filter: "not port 5201"}
      convert_to_json: true
    verify:
      - log: {glob: "*.json", lacks: "\\] ERROR :"}
      - files: {glob: "rtu-*.pcap", min: 2}
      - files: {glob: "*.jsonl", min: 1}
      # rtu-1's own filter applied, and did not carry over to rtu-2
      - python: {function: rtu1_has_no_modbus, windows: true}
      - pcap: {glob: "rtu-2-*.pcap", tcp_port: 502, min_packets: 10, windows: true}
  tcpdump:
    config:
      # iperf's mirrored traffic arrives in GRE too, and its inner port is out of
      # BPF's reach; its full-size segments are not: Modbus-in-GRE is small.
      # No parens: and/or are left-associative, so this is (gre and small) or modbus.
      # ponytail: size cut, decap or an inner-offset filter if a big GRE packet matters
      vms: [{hostname: monitor, iface: any, filter: "ip proto 47 and less 600 or tcp port 502"}]
      convert_to_json: true
    verify:
      # a failed kill or conversion is logged as an error and the stage carries on
      - log: {glob: "*.json", lacks: "\\] ERROR :"}
      - files: {glob: "*.pcap", min: 1}
      - files: {glob: "*.jsonl", min: 1}
      # the mirror delivers GRE: count it as well as plain Modbus, like the filter
      - pcap: {glob: "*.pcap", tcp_port: 502, ip_proto: 47, min_packets: 10, windows: true}
  mm:
    config:
      start:
        - type: start_capture
          capture: {bridge: phenix, filename: burger-bridge.pcap, filter: "tcp port 502"}
      stop: [{type: stop_capture, capture: {bridge: phenix, convert: true}}]
      vms:
        - hostname: simulink-provider
          start:
            - type: start_capture
              capture: {interface: 0, filename: burger-provider.pcap, filter: "not tcp port 502"}
          stop: [{type: stop_capture, capture: {interface: 0, convert: true}}]
    verify:
      - log: {glob: "*.json", lacks: "\\] ERROR :"}
      - files: {glob: "burger-*.pcap", min: 2}
      - files: {glob: "*.jsonl", min: 2}
      - pcap: {glob: "burger-bridge.pcap", tcp_port: 502, min_packets: 10, windows: true}
  vmstats: {config: {vms: [rtu-1, rtu-2, simulink-provider]}}
  qos: {config: {vms: [{hostname: rtu-2, interface: 0, delay: 20}]}}
