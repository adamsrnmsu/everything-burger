# #183 (nblair2): split cc responses on whole header lines, so stderr no longer
# swallows stdout and a '/' in output no longer cuts it short.
# cc-output-parsing is #183's own failure case; every burger health check also
# goes through this parsing, so the bennu items should pass as on baseline.
# #183 and #157 each merge onto main but conflict with each other in
# test_utils.py, so #157 runs on cc-header.
about: "#183 cc response parsing by header line"
route: waterway
apps: {prs: [183]}
items:
  cc-output-parsing: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
