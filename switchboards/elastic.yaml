# connect_elastic raises AppError instead of sys.exit(1) when the Elasticsearch
# it connects to returns no cluster info (#192). Only an empty reply reaches that
# line: a refused connection raises inside the client either way. es-stub, a
# fake Elasticsearch answering `{}` on the provider VM, gives providerdata
# (#177) that reply, and elastic-empty passes when its start stage fails with
# #192's error. Both are on main.
#
# On soap, over mgmt_tap (the phenix host needs a route to the provider's MGMT
# address).
about: "providerdata's connect_elastic against an empty Elasticsearch reply (main)"
route: soap
apps: {prs: []}
items:
  elastic-empty: on
  es-stub: on
  bennu/power-solver: on
runs:
  - name: elastic
    # configure starts pybennu-power-solver, which start needs running
    configure: [elastic-empty]
    start: [es-stub, elastic-empty]
