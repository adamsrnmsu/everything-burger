# ettercap ARP MITM on the mitm route (topologies repo mitm/), which has its own
# kali (10.1.1.200) on the ICS segment with rtu-1, rtu-2 and the router (on a
# route without one, the item's requires.attacker injects it). ettercap
# ARP-poisons rtu-1 and the router (10.1.1.1) so the OPC
# server's Modbus polls to rtu-1 route through kali. mitm-capture sniffs kali's
# ICS interface for Modbus: kali is not a Modbus endpoint, so any port-502
# packets there are the intercepted polls.
#
# This is its own board, so the MITM never disturbs the Modbus the other
# boards' items rely on. Uses the ettercap component from #203.
about: "ettercap MITM on the ICS segment; kali intercepts OPC->rtu-1 Modbus"
route: mitm
apps: {prs: [203]}
items:
  ettercap: on
  mitm-capture: on
  # confirm the RTUs actually serve Modbus, so there is traffic to intercept
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
runs:
  - name: mitm
    start: [mitm-capture, ettercap]
    stop: [ettercap, mitm-capture]
