# providerdata, rtds (#166) and collector (with the disruption it reads), live
# on soap's PyPower provider. All of soap is kept.
about: "#166 rtds, providerdata, collector on soap's PyPower provider"
route: soap
apps: {prs: [166]}
items:
  rtds: on
  providerdata: on
  collector: on
  disruption: on
  bennu/power-solver: on
overrides:
  disruption: {config: {permutation: 0, run_duration: 60}}
runs:
  - name: provider
    configure: [rtds, providerdata]
    # disruption holds start for run_duration while the provider runs.
    start: [rtds, providerdata, disruption]
    # rtds stop stops the provider, so providerdata exports first; the
    # collector reads both folders last.
    stop: [providerdata, rtds, collector]
    cleanup: [rtds]
