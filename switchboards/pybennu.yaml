# pybennu under live load on soap's PyPower provider: bennu main (#59 merged) as the deb and
# the pybennu wheel, on upstream main apps, so a failure points at bennu.
about: "bennu main (#59) deb + pybennu wheel on soap's PyPower provider"
route: soap
apps: {prs: []}
bennu:
  branch: main
  install: [deb, pybennu]
  pip: ["loguru>=0.7,<1"]  # bennu main needs it since #59; bennu.qc2 lacks it and the VMs have no index
items:
  bennu/field-device: on
  bennu/pybennu-provider: on
  bennu/siren: on
