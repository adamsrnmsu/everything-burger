# #170 ssh into a waterway RTU over mgmt_tap. Needs BURGER_VM_PASSWORD, the
# root password of the bennu.qc2 image; it lands in the rendered scenario.
about: "#170 ssh to rtu-1 over mgmt_tap"
route: waterway
apps: {prs: [170]}
items:
  ssh: on
  bennu/field-device: on
  bennu/simulink-provider: on
  bennu/modbus-polled: on
runs:
  - name: ssh
    start: [ssh]
