apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: waterway-arm64
spec:
  nodes:
  - general:
      hostname: waterway-provider
      description: SCEPTRE Simulink provider (Rust simulinksolver)
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: bennu-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: mgmt
        address: 172.16.1.2
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
        gateway: 172.16.1.1
    type: VirtualMachine
  - general:
      hostname: opc
      description: OPC UA gateway
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: opc-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.50
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
        gateway: 10.1.2.1
      - name: mgmt
        address: 172.16.2.50
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/waterway-arm64/injects/opc_gateway.json
      dst: /etc/sceptre/opc_gateway.json
      description: opc_gateway.json
      permissions: '0644'
  - general:
      hostname: historian
      description: InfluxDB + telegraf
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: historian-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.60
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
        gateway: 10.1.2.1
      - name: mgmt
        address: 172.16.2.60
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/waterway-arm64/injects/telegraf.conf
      dst: /etc/telegraf/telegraf.conf
      description: telegraf.conf
      permissions: '0644'
    - src: /phenix/topologies/waterway-arm64/injects/influx-setup.sh
      dst: /etc/phenix/startup/influx-setup.sh
      description: influx-setup.sh
      permissions: '0644'
  - general:
      hostname: hmi
      description: Firefox kiosk on FUXA
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: hmi-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd -device virtio-gpu-pci -device
        usb-kbd,bus=xhci.0
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.70
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
        gateway: 10.1.2.1
      - name: mgmt
        address: 172.16.2.70
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/waterway-arm64/injects/hmi_url
      dst: /etc/sceptre/hmi_url
      description: hmi_url
      permissions: '0644'
    - src: /phenix/topologies/waterway-arm64/injects/10-noblank.conf
      dst: /etc/X11/xorg.conf.d/10-noblank.conf
      description: 10-noblank.conf
      permissions: '0644'
  - general:
      hostname: scada-server
      description: FUXA
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: scada-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.71
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
        gateway: 10.1.2.1
      - name: mgmt
        address: 172.16.2.71
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/waterway-arm64/injects/fuxa_project.json
      dst: /etc/sceptre/fuxa_project.json
      description: fuxa_project.json
      permissions: '0644'
  - general:
      hostname: engineer-workstation
      description: xfce + brash terminals
    hardware:
      cpu: host
      memory: 2048
      vcpus: 2
      os_type: linux
      drives:
      - image: engineer-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd -device virtio-gpu-pci -device
        usb-kbd,bus=xhci.0
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.72
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
        gateway: 10.1.2.1
      - name: mgmt
        address: 172.16.2.72
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
    injections:
    - src: /phenix/topologies/waterway-arm64/injects/rtus.txt
      dst: /etc/sceptre/rtus.txt
      description: rtus.txt
      permissions: '0644'
    - src: /phenix/topologies/waterway-arm64/injects/10-noblank.conf
      dst: /etc/X11/xorg.conf.d/10-noblank.conf
      description: 10-noblank.conf
      permissions: '0644'
  - general:
      hostname: rtu-1
      description: SCEPTRE RTU
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: bennu-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.1.101
        mask: 24
        proto: static
        type: ethernet
        vlan: ICS
        gateway: 10.1.1.1
      - name: mgmt
        address: 172.16.1.101
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: rtu-2
      description: SCEPTRE RTU
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: linux
      drives:
      - image: bennu-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.1.102
        mask: 24
        proto: static
        type: ethernet
        vlan: ICS
        gateway: 10.1.1.1
      - name: mgmt
        address: 172.16.1.102
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: VirtualMachine
  - general:
      hostname: router
      description: Router
    hardware:
      cpu: host
      memory: 1024
      vcpus: 2
      os_type: minirouter
      drives:
      - image: minirouter-arm64.qc2
        interface: virtio
        inject_partition: 2
    advanced:
      machine: virt
      vga: virtio
      qemu-append: -bios /usr/share/AAVMF/AAVMF_CODE.fd
    overrides:
      bus=usb-bus.0: bus=xhci.0
    network:
      interfaces:
      - name: IF0
        address: 10.1.2.1
        mask: 24
        proto: static
        type: ethernet
        vlan: SCADA
      - name: IF1
        address: 10.1.1.1
        mask: 24
        proto: static
        type: ethernet
        vlan: ICS
      - name: mgmt
        address: 172.16.1.1
        mask: 16
        proto: static
        type: ethernet
        vlan: MGMT
    type: Router
