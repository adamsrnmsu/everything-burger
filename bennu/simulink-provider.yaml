name: simulink-provider
kind: bennu
type: simulink-provider
about: The Simulink provider and its solver run on the provider VM.
routes: [waterway]
verify:
  - vm:
      host: "{route.provider}"
      # Raw vm: the optional (-helics) alternation is not a process-name shorthand.
      run: "pgrep -f '(^|/)bennu-simulink-provider(-helics)?( |$)'"
  - process: {host: "{route.provider}", name: simulinksolver}
