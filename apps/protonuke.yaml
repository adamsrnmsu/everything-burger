name: protonuke
kind: app
type: protonuke
about: >
  The protonuke app on a server (the first RTU, `-serve -http`) and a client (the
  second RTU, `-http` at the server's IF0). The app writes PROTONUKE_ARGS into
  /etc/default/protonuke on each host. The images ship neither protonuke nor its
  service, so requires.protonuke copies the binary out of the minimega container
  and a startup script runs it as a systemd unit reading that file: a pass means
  each VM got its own args, the server listens on port 80 and the client's
  connections reach it.
routes: [waterway, waterway-arm64]
hosts:
  - hostname: "{route.rtus[0]}"
    metadata: {args: "-serve -http"}
  - hostname: "{route.rtus[1]}"
    metadata: {args: "-http 10.1.1.101"}
# Addresses are waterway's: rtu-1 10.1.1.101.
verify:
  - vm:
      host: "{route.rtus[0]}"
      run: "cat /etc/default/protonuke"
      expect: "PROTONUKE_ARGS = -serve -http"
  - vm:
      host: "{route.rtus[1]}"
      run: "cat /etc/default/protonuke"
      expect: "PROTONUKE_ARGS = -http 10.1.1.101"
  - port: {host: "{route.rtus[0]}", port: 80, state: listening}
  # the client's traffic reached the server: a connection from rtu-2's ICS address to :80
  - vm:
      host: "{route.rtus[0]}"
      run: "ss -Htan 'sport = :80'"
      expect: "10\\.1\\.1\\.102\\]?:"
requires:
  protonuke: {nodes: "{route.rtus}"}
