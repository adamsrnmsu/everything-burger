name: otsim
kind: app
type: ot-sim
about: >
  The ot-sim app writing OT-sim configs for a three-tier chain on the Linux nodes:
  the first RTU an fd-server with two Modbus devices (a bus and a breaker, from the
  default power-distribution mapping), the second RTU a fep polling it, and the
  provider an fd-client polling the fep. The HELICS broker is the helics item's root
  ({route.rtus[0]}|IF0) with no base-fed-count, so the app writes no broker script of
  its own. A pass means each VM got /etc/ot-sim/config.xml with the right modules and
  endpoints. ot-sim is not in bennu.qc2, so nothing runs the configs; node-red, logic
  and the API TLS options are not covered.
routes: [waterway, waterway-arm64]
config:
  helics: {broker: {hostname: "{route.rtus[0]}|IF0"}}
hosts:
  - hostname: "{route.rtus[0]}"
    metadata:
      type: fd-server
      modbus:
        - {name: bus-01, type: bus}
        - {name: brkr-01, type: breaker}
  - hostname: "{route.rtus[1]}"
    metadata: {type: fep, connected_rtus: ["{route.rtus[0]}"]}
  - hostname: "{route.provider}"
    metadata: {type: fd-client, connected_rtus: ["{route.rtus[1]}"]}
# Addresses are waterway's: rtu-1 10.1.1.101, rtu-2 10.1.1.102 (IF0).
verify:
  # fd-server: an I/O module federated to the helics root broker on rtu-1 itself
  - vm:
      host: "{route.rtus[0]}"
      run: "grep -A1 '<io name=.helics-federate.>' /etc/ot-sim/config.xml"
      expect: "<broker-endpoint>10.1.1.101</broker-endpoint>"
  # fd-server: a Modbus server on its own IF0, carrying both devices' registers
  - vm:
      host: "{route.rtus[0]}"
      run: "grep -A1 'modbus-outstation. mode=.server.' /etc/ot-sim/config.xml"
      expect: "<endpoint>10.1.1.101:502</endpoint>"
  - vm:
      host: "{route.rtus[0]}"
      run: "grep -q '<tag>bus-01.voltage</tag>' /etc/ot-sim/config.xml && grep -q '<tag>brkr-01.controls</tag>' /etc/ot-sim/config.xml"
  # fep: a Modbus client polling rtu-1, and (its default downstream) a DNP3 outstation
  - vm:
      host: "{route.rtus[1]}"
      run: "grep -A1 'modbus-outstation. mode=.client.' /etc/ot-sim/config.xml"
      expect: "<endpoint>10.1.1.101:502</endpoint>"
  - vm:
      host: "{route.rtus[1]}"
      run: "grep -A1 'dnp3-outstation. mode=.server.' /etc/ot-sim/config.xml"
      expect: "<endpoint>10.1.1.102:20000</endpoint>"
  # fd-client: got a config with the message bus (what it polls is otsim-fep-client)
  - vm:
      host: "{route.provider}"
      run: "grep -q ot-sim-message-bus /etc/ot-sim/config.xml"
