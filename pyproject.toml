[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "burger"
version = "0.1.0"
description = "Switchboards, item files and checks for sceptre-phenix test rounds"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PyYAML", "loguru", "rich", "pyfiglet"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "vulture"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material"]

[project.scripts]
burger = "burger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
burger = ["templates/*.yaml", "assets/*.ans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.vulture]
min_confidence = 80
