name: modbus-badframes
kind: scorch
type: cc
about: >
  Malformed Modbus TCP requests against the first RTU's bennu-field-device
  (bennu #81: a request cut short mid-body was answered from the previous
  request still in the receive buffer, and an MBAP length above the 1024 byte
  buffer overflowed it). On the RTU itself, one connection sends a valid read
  and then the same request cut after the function code (half-close), and one
  connection each sends an MBAP length of 0, 4000 and 65535 with that many
  bytes after it. Fails when any of those got a Modbus response, when the
  field device's pid changed or it died, when a normal read no longer answers,
  or when its stderr log grew by more than BURGER_BADFRAMES_MAX_LOG_BYTES
  (1000000). Fails on stock bennu (the truncated request is answered), passes
  with #81.
routes: [waterway, waterway-arm64]
stages: [start]
# ${VAR:-default} expansions are read when burger loads this file. No other ${...} in here.
config:
  vms:
    - hostname: "{route.rtus[0]}"
      start:
        - type: exec
          wait: true
          args: |
            python3 - <<'PY'
            import glob, json, os, socket, struct, subprocess, time
            MAX_LOG = int("${BURGER_BADFRAMES_MAX_LOG_BYTES:-1000000}")
            PORT, OUT = {route.ics_port}, "/tmp/burger-badframes.json"
            REQ = struct.pack(">HHHBBHH", 1, 0, 6, 1, 3, 0, 1)  # read 1 holding register
            res = {"max_log_bytes": MAX_LOG, "error": None, "pid_before": None, "pid_after": None,
                   "cases": [], "log_grew": None, "answers": False}

            def logsize(pid):
                paths = {"/etc/sceptre/log/watcher-stderr.log"}
                try:
                    t = os.readlink(f"/proc/{pid}/fd/2")
                    if t.startswith("/") and os.path.isfile(t):
                        paths.add(t)
                except OSError:
                    pass
                return sum(os.path.getsize(p) for p in paths if os.path.isfile(p))

            def poll(host):
                with socket.create_connection((host, PORT), timeout=3) as s:
                    s.settimeout(3)
                    s.sendall(REQ)
                    return len(s.recv(256)) >= 9

            def case(host, name, frames):
                """Send each frame, half-close, and return whatever the server sends after the last."""
                got = b""
                with socket.create_connection((host, PORT), timeout=3) as s:
                    s.settimeout(3)
                    for i, f in enumerate(frames):
                        try:
                            s.sendall(f)
                        except OSError:
                            break  # the server already closed on us
                        if i < len(frames) - 1:
                            s.recv(256)  # the answer to the valid request
                    try:
                        s.shutdown(socket.SHUT_WR)
                    except OSError:
                        pass
                    try:
                        while True:
                            d = s.recv(4096)
                            if not d:
                                break
                            got += d
                    except (socket.timeout, OSError):
                        pass
                res["cases"].append({"name": name, "response": got.hex()})

            try:
                pids = []
                for d in glob.glob("/proc/[0-9]*"):
                    try:
                        argv0 = open(d + "/cmdline", "rb").read().split(bytes(1))[0]
                    except OSError:
                        continue
                    if os.path.basename(argv0) in (b"bennu-field-device", b"bennu-field-deviced"):
                        pids.append(int(d.rsplit("/", 1)[1]))
                if not pids:
                    raise RuntimeError("no bennu-field-device process")
                pid = res["pid_before"] = pids[0]
                ips = subprocess.run(["hostname", "-I"], capture_output=True, text=True).stdout.split()
                host = None
                for _ in range(30):
                    for h in ["127.0.0.1", *ips]:
                        try:
                            if poll(h):
                                host = h
                                break
                        except OSError:
                            pass
                    if host:
                        break
                    time.sleep(2)
                if not host:
                    raise RuntimeError("the server never answered a Modbus read")
                log0 = logsize(pid)
                case(host, "truncated request", [REQ, REQ[:8]])
                for n in (0, 4000, 65535):
                    case(host, f"MBAP length {n}", [struct.pack(">HHH", 1, 0, n) + b"A" * (n or 8)])
                time.sleep(1)
                res["pid_after"] = pid if os.path.isdir(f"/proc/{pid}") else None
                res["log_grew"] = logsize(pid) - log0
                try:
                    res["answers"] = poll(host)
                except OSError:
                    pass
            except Exception as e:
                res["error"] = f"{type(e).__name__}: {e}"
            finally:
                json.dump(res, open(OUT, "w"))
                print(json.dumps(res))
            PY
        - type: recv
          args: /tmp/burger-badframes.json
verify:
  - python: judge_badframes
