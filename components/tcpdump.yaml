name: tcpdump
kind: scorch
type: tcpdump
about: >
  Runs tcpdump inside the second RTU on every interface, filtered to the ICS port.
routes: [waterway, soap, waterway-arm64]
stages: [start, stop]
config:
  vms: [{hostname: "{route.rtus[1]}", iface: any, filter: "tcp port {route.ics_port}"}]
verify:
  - files: {glob: "*.pcap", min: 1}
  # The traffic is SCADA/OPC polling: skipped without the Windows nodes.
  - pcap: {glob: "*.pcap", tcp_port: "{route.ics_port}", min_packets: 10, windows: true}
# The arm64 range's OPC poller speaks DNP3 to the RTUs (:20000), not Modbus.
waterway-arm64:
  config:
    vms: [{hostname: "{route.rtus[1]}", iface: any, filter: "tcp port 20000"}]
  verify:
    - files: {glob: "*.pcap", min: 1}
    - pcap: {glob: "*.pcap", tcp_port: 20000, min_packets: 10}
