name: ettercap
kind: scorch
type: ettercap
about: >
  Runs ettercap on the injected kali attacker (requires.attacker adds it to
  the ICS segment) to ARP man-in-the-middle rtu-1 and the ICS router
  (10.1.1.1), so the OPC server's Modbus polls to rtu-1 flow through kali.
  Pair with mitm-capture, which proves the interception.
routes: [waterway, mitm, waterway-arm64, mitm-arm64]
stages: [start, stop]
requires:
  attacker: true
config:
  vms:
    - hostname: kali
      iface: "{route.ics_iface}"
      targets: "/10.1.1.101// /10.1.1.1//"
