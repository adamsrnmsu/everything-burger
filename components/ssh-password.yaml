name: ssh-password
kind: scorch
type: cc
about: >
  Sets root's password on the first RTU to BURGER_VM_PASSWORD at configure, so
  the ssh item tests the component and not whether the operator remembers the
  bennu.qc2 image's password. The value lands in the rendered scenario: keep it
  a lab-only one, with no quotes, spaces or $.
routes: [waterway]
stages: [configure]
config:
  vms:
    - hostname: "{route.rtus[0]}"
      configure:
        # burger fills in the value at render, so phenix sees no $: minimega
        # expands bare $name, SCORCH templating eats ${...}.
        - type: exec
          wait: true
          args: "echo 'root:${BURGER_VM_PASSWORD}' | chpasswd"
requires:
  env: [BURGER_VM_PASSWORD]
