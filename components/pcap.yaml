name: pcap
kind: scorch
type: pcap
about: >
  Captures packets on the first RTU's interface 0 for the length of the run
  and checks the ICS port shows traffic.
routes: [waterway, soap]
stages: [start, stop]
config:
  vms: [{hostname: "{route.rtus[0]}", interface: 0}]
verify:
  - status: ok
  - files: {glob: "*.pcap", min: 1}
  # The traffic is SCADA/OPC polling: skipped without the Windows nodes.
  - pcap: {glob: "*.pcap", tcp_port: "{route.ics_port}", min_packets: 10, windows: true}
