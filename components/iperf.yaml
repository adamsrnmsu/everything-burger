name: iperf
kind: scorch
type: iperf
about: >
  iperf between two RTUs on the ICS network. bennu.qc2 has no iperf3, so the
  jammy packages are installed into both VMs at boot.
routes: [waterway]
stages: [configure, start, stop, cleanup]
config:
  run_duration: 20
  # #165 allowlists these (letters, digits, space and _.,:=@%/+-); --omit 2
  # drops the first two seconds of every client's report.
  add_client_args: "--omit 2"
  iperf_paths: {linux: /usr/bin/iperf3}
  servers:
    - hostname: "{route.rtus[0]}"
      port_range_start: 5201
      clients: [{hostname: "{route.rtus[1]}"}]
verify:
  # the results come from the iperf3 this board injects, not some other one
  - json: {glob: "iperf_client-*.json", field: start.version, matches: '^iperf 3\.9\b'}
requires:
  debs:
    packages: [iperf3, libiperf0, libsctp1]
    nodes: "{route.rtus}"
  apps_prs: [165]
